server:
  port: ${PORT:8080}
spring:
  application:
    name: taskflow
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskflow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow_dev}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
app:
  jwt:
    secret: ${JWT_SECRET:Zm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWtleS0zMi1ieXRlcw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
